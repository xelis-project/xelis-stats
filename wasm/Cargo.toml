[package]
name = "xelis-stats-decompiler"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde_json = "1"
console_error_panic_hook = "0.1"
silex-decompiler = { git = "https://github.com/xelis-project/xelis-vm", tag = "v1.4.0" }
silex-bytecode = { git = "https://github.com/xelis-project/xelis-vm", tag = "v1.4.0" }
xelis_common = { git = "https://github.com/xelis-project/xelis-blockchain", branch = "dev", package = "xelis_common" }

# xelis_common pulls these transitively on wasm32; the backend cfg is supplied
# by the build script (see build.sh).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4.0-rc.0", features = ["wasm_js"] }
web-time = "1.1.0"

[dev-dependencies]
silex-lexer = { git = "https://github.com/xelis-project/xelis-vm", tag = "v1.4.0" }
silex-parser = { git = "https://github.com/xelis-project/xelis-vm", tag = "v1.4.0" }
silex-compiler = { git = "https://github.com/xelis-project/xelis-vm", tag = "v1.4.0" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
